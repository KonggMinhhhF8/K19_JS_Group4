<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Chỉnh sửa sản phẩm | ShopAdmin</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        />
        <style></style>
    </head>
    <body>
        <div class="container">
            <aside class="sidebar">
                <h2>ShopAdmin</h2>
                <ul>
                    <li><i class="fas fa-home"></i> Tổng quan</li>
                    <li class="active"><i class="fas fa-box"></i> Sản phẩm</li>
                    <li><i class="fas fa-shopping-cart"></i> Đơn hàng</li>
                    <li><i class="fas fa-users"></i> Khách hàng</li>
                    <li><i class="fas fa-chart-line"></i> Báo cáo</li>
                </ul>
            </aside>

            <main class="main-content">
                <div class="header-actions">
                    <a href="#" class="btn-back"
                        ><i class="fas fa-arrow-left"></i> Quay lại danh sách</a
                    >
                    <h2>Chỉnh sửa sản phẩm</h2>
                </div>

                <form id="productForm">
                    <div class="product-grid">
                        <div class="left-col">
                            <div class="card">
                                <h3>Thông tin chung</h3>
                                <div class="form-group">
                                    <label>Tên sản phẩm</label>
                                    <input
                                        type="text"
                                        placeholder="Ví dụ: iPhone 15 Pro Max"
                                        value="iPhone 15 Pro Max"
                                    />
                                </div>
                                <div class="form-group">
                                    <label>Mô tả sản phẩm</label>
                                    <textarea
                                        rows="5"
                                        placeholder="Nhập đặc điểm nổi bật..."
                                    ></textarea>
                                </div>
                            </div>

                            <div class="card">
                                <h3>Giá cả & Kho hàng</h3>
                                <div
                                    style="
                                        display: grid;
                                        grid-template-columns: 1fr 1fr;
                                        gap: 20px;
                                    "
                                >
                                    <div class="form-group">
                                        <label>Giá bán (VNĐ)</label>
                                        <input type="number" value="32500000" />
                                    </div>
                                    <div class="form-group">
                                        <label>Giá vốn (VNĐ)</label>
                                        <input type="number" value="28000000" />
                                    </div>
                                </div>
                                <div
                                    style="
                                        display: grid;
                                        grid-template-columns: 1fr 1fr;
                                        gap: 20px;
                                    "
                                >
                                    <div class="form-group">
                                        <label>Mã SKU</label>
                                        <input
                                            type="text"
                                            value="IP15PM-BLUE-256"
                                        />
                                    </div>
                                    <div class="form-group">
                                        <label>Số lượng tồn kho</label>
                                        <input type="number" value="45" />
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="right-col">
                            <div class="card">
                                <h3>Hình ảnh sản phẩm</h3>
                                <div
                                    class="image-upload"
                                    onclick="
                                        document
                                            .getElementById('fileInput')
                                            .click()
                                    "
                                >
                                    <i class="fas fa-cloud-upload-alt"></i>
                                    <p>Nhấp để tải ảnh lên</p>
                                    <input
                                        type="file"
                                        id="fileInput"
                                        hidden
                                        onchange="previewImage(event)"
                                    />
                                    <img
                                        id="imgPreview"
                                        class="preview-img"
                                        src="#"
                                        alt="Preview"
                                    />
                                </div>
                            </div>

                            <div class="card">
                                <h3>Phân loại</h3>
                                <div class="form-group">
                                    <label>Danh mục</label>
                                    <select>
                                        <option>Điện thoại</option>
                                        <option>Máy tính bảng</option>
                                        <option>Phụ kiện</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Trạng thái</label>
                                    <select>
                                        <option>Đang bán</option>
                                        <option>Ngừng kinh doanh</option>
                                        <option>Hết hàng</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-footer">
                        <button type="button" class="btn btn-cancel">
                            Hủy bỏ
                        </button>
                        <button type="submit" class="btn btn-save">
                            Lưu thay đổi
                        </button>
                    </div>
                </form>
            </main>
        </div>

        <script>
            function previewImage(event) {
                const reader = new FileReader();
                reader.onload = function () {
                    const output = document.getElementById("imgPreview");
                    output.src = reader.result;
                    output.style.display = "block";
                };
                reader.readAsDataURL(event.target.files[0]);
            }
        </script>
    </body>
</html>
